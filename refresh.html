<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Actualizar DCD EK</title>
<style>
body{margin:0;background:#071018;color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
.box{max-width:520px;background:#0d1822;border:1px solid #213342;border-radius:18px;padding:22px;text-align:center}
h1{font-size:24px;margin:0 0 12px}.muted{color:#91a4b5;line-height:1.5}
</style>
</head>
<body><div class="box"><h1>Actualizando DCD EK…</h1><div class="muted" id="s">Limpiando la versión anterior.</div></div>
<script>
(async()=>{
  const s=document.getElementById('s');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
    s.textContent='Listo. Abriendo la versión nueva…';
  }catch(e){
    s.textContent='Abriendo la versión nueva…';
  }
  setTimeout(()=>location.replace('./?fresh=20260924-0854'),700);
})();
</script></body></html>
